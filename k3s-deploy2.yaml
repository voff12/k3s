apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: default
  labels:
    app: springboot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      terminationGracePeriodSeconds: 35

      containers:
        - name: springboot-container
          image: docker.io/library/k3s:v1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"

          env:
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=50.0
                -XX:InitialRAMPercentage=50.0
                -Djava.security.egd=file:/dev/./urandom

            # ── Nacos 连接配置 ──
            # NACOS_ENABLED 必须显式为 true：bootstrap.properties 中
            # spring.cloud.nacos.config.enabled 默认 false，缺失则整个 Nacos 客户端不激活（零 Nacos 日志）
            - name: NACOS_ENABLED
              value: "true"
            # 对应 k8s/nacos.yaml 中 Service metadata.name: nacos-svc（集群内 DNS）
            - name: NACOS_SERVER_ADDR
              value: "nacos-svc.default.svc.cluster.local:8848"
            # 命名空间留空 = public（"public" 不是合法 namespace ID，显式传会查不到配置）
            - name: NACOS_NAMESPACE
              value: ""
            - name: NACOS_GROUP
              value: "DEFAULT_GROUP"
            - name: NACOS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nacos-auth
                  key: username
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nacos-auth
                  key: password

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-svc
  labels:
    app: springboot-app   # ServiceMonitor selector 按此匹配
spec:
  type: NodePort
  selector:
    app: springboot-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 32121
    # Prometheus 抓取端口（ServiceMonitor endpoints[].port: management）
    - name: management
      protocol: TCP
      port: 8081
      targetPort: 8081