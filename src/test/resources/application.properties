# 测试专用：H2 MySQL 兼容模式跑 Flyway 迁移与仓储层，无需本地 MySQL
spring.datasource.url=jdbc:h2:mem:delivery;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# 测试环境不连 K3s/Nacos
spring.cloud.nacos.config.enabled=false
k8s.kubeconfig=
k8s.master.url=

# QwenService 的 @Value 无默认值，测试环境给空串
qwen.api.key=
