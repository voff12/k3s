server.port=8080

# ===========================
# 交付中心数据源（docs/plans/delivery-center-backend-design.md）
# 凭据走环境变量，不在配置文件中写明文
# ===========================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/k3db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Set your K3s API URL (e.g., https://192.168.1.100:6443)
# TODO: Update this to your running K3s instance. 127.0.0.1:6443 is default.
# k8s.master.url=https://127.0.0.1:6443
# Set path to your K3s kubeconfig (e.g., /etc/rancher/k3s/k3s.yaml)
# Set path to your K3s kubeconfig (e.g., /etc/rancher/k3s/k3s.yaml)
k8s.kubeconfig=/etc/rancher/k3s/k3s.yaml

# Qwen AI Configuration
# 使用 OpenAI 兼容协议，更稳定
# qwen.api.key 由 Nacos 配置中心统一管理（Data ID: k3s-demo.properties）
# 本地开发时若未启动 Nacos，可在此直接填写；生产环境请留空由 Nacos 注入
qwen.api.key=${QWEN_API_KEY:}
# OpenAI 兼容协议 URL（中国区）
qwen.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1
# 使用更稳定的模型：qwen-plus（推荐）或 qwen-max（更强）或 qwen-turbo（更快）
qwen.api.model=qwen-max

# Development configuration - Disable template cache
spring.thymeleaf.cache=false

# Harbor Registry Configuration
harbor.host=harbor.local:30002
harbor.ip=60.205.252.82
harbor.project=library
harbor.username=admin
harbor.password=

# GitLab Configuration (optional, for private repo access)
gitlab.token=

# === Git 代理 (可选, 用于 K3s Pod 无法直连 GitHub 的场景) ===
# 代理需能被 Pod 访问: 使用宿主机 IP 或内网代理地址，如 http://192.168.1.100:7890
# 单节点 K3s 可用节点 IP；K3d 用 http://host.k3d.internal:7890
git.proxy=

# === 基础镜像仓库 (Kaniko 从这里拉 Dockerfile 基础镜像, 使用内网 Harbor) ===
# 改为从 Harbor 拉取, prewarm-images.sh 需将基础镜像推送到 Harbor
# 排查结论(2026-10-08): Kaniko Pod 与 registry 同机(hostNetwork 在节点 172.16.223.135 上监听 5000),
# 但容器运行时从宿主机访问 localhost:5000 不稳定;改为节点 IP 直接可达,registry-check init 容器走此地址
local.registry=172.16.223.135:5000

# === 流水线容器镜像 (离线模式: 需先执行 prewarm-images.sh 预热) ===
buildkit.image=moby/buildkit:v0.25.1-rootless
git.image=alpine:3.19
maven.image=maven:3.9-eclipse-temurin-17
loader.image=rancher/k3s:latest

# ===========================
# Actuator 健康检查
# ===========================
# 暴露 health 端点 + Prometheus 指标端点（ServiceMonitor 抓取 /actuator/prometheus）
management.endpoints.web.exposure.include=health,info,prometheus
# 启用 Kubernetes 探针（/actuator/health/liveness, /actuator/health/readiness）
management.endpoint.health.probes.enabled=true
# 显示详细健康状态（UP/DOWN + 各组件状态）
management.endpoint.health.show-details=always
# Actuator 独立端口（与业务端口隔离，安全最佳实践）
management.server.port=8081

# ===========================
# Graceful Shutdown 优雅关闭
# ===========================
# 启用优雅关闭：收到 SIGTERM 后不再接受新请求，等待现有请求完成
server.shutdown=graceful
# 优雅关闭超时：最多等待 30 秒让进行中的请求完成
spring.lifecycle.timeout-per-shutdown-phase=30s
